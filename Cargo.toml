[workspace]
resolver = "2"
members = ["crates/iratxo-core", "crates/iratxo-cli", "crates/iratxo-bench-runner"]
# iratxo-engine has a wasm-only target and is built with --target wasm32-unknown-unknown
# so it's intentionally excluded from default workspace builds.
exclude = ["crates/iratxo-engine", "fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[profile.release]
lto = true

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
serde_yaml = "0.9"
regex = "1"
anyhow = "1"
