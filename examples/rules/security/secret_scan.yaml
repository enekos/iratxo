name: secret_scan
description: |
  Catch leaked secrets before they hit a log line, a Slack channel, or a
  shared document. Pairs vendor-prefix regex (Stripe, AWS, GitHub) with a
  generic high-entropy fallback for tokens that don't carry a known prefix.

rules:
  - id: stripe_key
    when:
      regex: "(?i)\\b(sk|pk|rk)_(live|test)_[a-z0-9]{20,}\\b"
    classify: contains_secret
    confidence: 0.99
    explanation: "Stripe API key pattern."

  - id: aws_access_key
    when:
      regex: "\\bAKIA[0-9A-Z]{16}\\b"
    classify: contains_secret
    confidence: 0.99
    explanation: "AWS access key ID pattern."

  - id: github_token
    when:
      any:
        - regex: "(?i)\\bgithub_pat_[a-z0-9_]{20,}\\b"
        - regex: "\\bghp_[A-Za-z0-9]{30,}\\b"
        - regex: "\\bgho_[A-Za-z0-9]{30,}\\b"
    classify: contains_secret
    confidence: 0.99
    explanation: "GitHub personal-access / OAuth token."

  - id: openai_key
    when:
      regex: "\\bsk-[A-Za-z0-9]{20,}\\b"
    classify: contains_secret
    confidence: 0.95
    explanation: "OpenAI-style key prefix."

  - id: assignment_with_high_entropy_token
    when:
      all:
        - any:
            - regex: "(?i)\\b(api[_-]?key|secret|token|password|passwd|auth)\\s*[:=]"
            - contains_any:
                - "API_KEY="
                - "SECRET="
                - "TOKEN="
        - token_entropy_above:
            min_bits: 4.0
            min_token_len: 20
    classify: contains_secret
    confidence: 0.85
    explanation: "Secret-shaped assignment with a high-entropy value."

  - id: orphan_high_entropy_blob
    when:
      token_entropy_above:
        min_bits: 4.5
        min_token_len: 32
    classify: review_required
    confidence: 0.55
    explanation: "Long high-entropy token — possible secret, no known prefix."

default:
  classify: ok
  confidence: 1.0
