cases:
  - name: ordinary log line
    input: "Pipeline finished in 3.2s, 0 errors, 12 warnings."
    expect:
      classify: ok

  - name: stripe live key
    input: "rotate this please: sk_live_abcd1234efgh5678ijkl9012"
    expect:
      classify: contains_secret
      triggers: [stripe_key]

  - name: AWS access key
    input: "AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE in the deploy script"
    expect:
      classify: contains_secret
      triggers: [aws_access_key]

  - name: GitHub PAT
    input: "Use github_pat_11ABCDEFG0123456789abcdefghij for the bot"
    expect:
      classify: contains_secret
      triggers: [github_token]

  - name: assignment + high-entropy value
    input: "API_KEY=aZ9bX2qW7eR4tY6uI8oP3sD5fG1hJ0kL"
    expect:
      classify: contains_secret
      triggers: [assignment_with_high_entropy_token]

  - name: orphan high-entropy blob
    input: "deploy: aZ9bX2qW7eR4tY6uI8oP3sD5fG1hJ0kLmN8vC4xZ"
    expect:
      classify: review_required
      triggers: [orphan_high_entropy_blob]
